<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Lista de Compras — Comparativo</title>
  <meta name="description" content="Lista de compras por fornecedor com menor preço por item." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1e2530;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #58a6ff;
      --green:     #3fb950;
      --green-bg:  #0e2d17;
      --red:       #f85149;
      --orange:    #e3b341;
      --radius:    12px;
      --radius-sm: 8px;
      --font:      'Inter', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg,#0d1117,#161b22,#1a2236);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px; position: sticky; top:0; z-index:100;
      display: flex; align-items: center; justify-content: space-between; gap:12px;
    }
    .header-left { display:flex; align-items:center; gap:10px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--surface2); border:1px solid var(--border); color:var(--muted);
      border-radius:var(--radius-sm); padding:7px 12px; font-family:var(--font);
      font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; transition:all .2s;
    }
    .back-btn:hover { color:var(--text); background:var(--border); }
    .header-title { font-size:16px; font-weight:800; }
    .header-sub   { font-size:11px; color:var(--muted); }
    .sync-badge {
      display:inline-flex; align-items:center; gap:5px;
      font-size:11px; color:var(--muted); padding:4px 8px;
      background:var(--surface2); border-radius:20px; border:1px solid var(--border);
    }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:background .3s; }
    .sync-dot.synced  { background:var(--green); }
    .sync-dot.syncing { background:var(--orange); animation:pulse 1s infinite; }
    .sync-dot.error   { background:var(--red); }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

    /* ── STORE TABS ── */
    .stores-scroll {
      display:flex; gap:10px; padding:14px 20px; overflow-x:auto;
      background:var(--surface); border-bottom:1px solid var(--border); scrollbar-width:none;
    }
    .stores-scroll::-webkit-scrollbar { display:none; }
    .store-tab {
      flex-shrink:0; border-radius:var(--radius-sm); padding:10px 14px;
      cursor:pointer; border:1px solid var(--border); background:var(--surface2);
      transition:all .2s; text-align:left; -webkit-tap-highlight-color:transparent;
    }
    .store-tab:hover  { border-color:var(--accent); }
    .store-tab.active { border-color:var(--green); background:var(--green-bg); }
    .store-tab .st-name  { font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px; }
    .store-tab.active .st-name  { color:var(--green); }
    .store-tab .st-items { font-size:10px; color:var(--muted); margin-top:2px; }
    .store-tab .st-total { font-size:14px; font-weight:800; margin-top:4px; }
    .store-tab.active .st-total { color:var(--green); }
    .badge-best {
      background:var(--green); color:#000; font-size:9px;
      padding:1px 5px; border-radius:10px; font-weight:700;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display:flex; align-items:center; gap:8px; padding:10px 20px;
      border-bottom:1px solid var(--border); background:var(--bg);
      overflow-x:auto; scrollbar-width:none;
    }
    .toolbar::-webkit-scrollbar { display:none; }
    .btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; border-radius:var(--radius-sm);
      font-family:var(--font); font-size:13px; font-weight:600;
      cursor:pointer; border:none; transition:all .2s;
      white-space:nowrap; -webkit-tap-highlight-color:transparent;
    }
    .btn-ghost  { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--border); }
    .btn-print  { background:linear-gradient(135deg,var(--accent),#4a9eff); color:#fff; }
    .btn-print:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(88,166,255,.3); }
    @media(max-width:480px){ .btn span{display:none} .btn{padding:8px} }

    /* ── CONTENT ── */
    .content { padding:16px 20px 100px; max-width:980px; margin:0 auto; }

    /* ── GLOBAL CARD ── */
    .global-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); margin-bottom:20px; overflow:hidden;
    }
    .gc-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; cursor:pointer; user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .gc-header:hover { background:rgba(255,255,255,.02); }
    .gc-title {
      font-size:13px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.7px;
      display:flex; align-items:center; gap:8px;
    }
    .gc-summary { font-size:12px; color:var(--muted); margin-top:2px; }
    .gc-body { display:none; padding:0 20px 18px; }
    .gc-body.open { display:block; }

    /* Global totals grid */
    .sup-compare-grid {
      display:grid; gap:10px;
      grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
      margin-bottom:16px;
    }
    .sup-compare-card {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:12px 14px; text-align:center;
      transition:all .2s; cursor:pointer; position:relative;
    }
    .sup-compare-card:hover { border-color:var(--accent); }
    .sup-compare-card.is-cheapest { border-color:var(--green); background:var(--green-bg); }
    .sup-compare-card.is-active   { border-color:var(--accent); background:rgba(88,166,255,.07); }
    .scc-name  { font-size:11px; color:var(--muted); font-weight:600; margin-bottom:6px; }
    .scc-total { font-size:18px; font-weight:800; }
    .sup-compare-card.is-cheapest .scc-total { color:var(--green); }
    .sup-compare-card.is-active   .scc-total { color:var(--accent); }
    .scc-diff  { font-size:11px; margin-top:4px; font-weight:600; }
    .scc-diff.cheaper   { color:var(--green); }
    .scc-diff.expensive { color:var(--red); }
    .scc-items { font-size:10px; color:var(--muted); margin-top:4px; }
    .scc-bar   { height:4px; border-radius:2px; background:var(--border); margin-top:8px; overflow:hidden; }
    .scc-bar-fill { height:100%; border-radius:2px; background:var(--muted); transition:width .4s; }
    .sup-compare-card.is-cheapest .scc-bar-fill { background:var(--green); }
    .sup-compare-card.is-active   .scc-bar-fill { background:var(--accent); }

    /* Mixed shopping row */
    .mixed-row {
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; flex-wrap:wrap; padding:12px 14px;
      background:linear-gradient(135deg,rgba(63,185,80,.08),rgba(63,185,80,.03));
      border:1px solid rgba(63,185,80,.25); border-radius:var(--radius-sm);
    }
    .mixed-row-left  { }
    .mixed-row-title { font-size:12px; color:var(--green); font-weight:700; }
    .mixed-row-sub   { font-size:11px; color:var(--muted); margin-top:2px; }
    .mixed-row-right { text-align:right; flex-shrink:0; }
    .mixed-total  { font-size:20px; font-weight:800; color:var(--green); }
    .mixed-saving { font-size:11px; color:var(--muted); margin-top:2px; }

    /* ── STORE HEADER ── */
    .store-header-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:16px 20px;
      margin-bottom:16px; display:flex; align-items:center;
      justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .shc-title { font-size:18px; font-weight:800; }
    .shc-meta  { font-size:12px; color:var(--muted); margin-top:2px; }
    .shc-total-block { text-align:right; }
    .shc-total-val { font-size:22px; font-weight:800; color:var(--green); }
    .shc-total-lbl { font-size:11px; color:var(--muted); }

    /* ── CATEGORY SECTION ── */
    .cat-section  { margin-bottom:20px; border-radius:var(--radius-sm); overflow:hidden; }
    .cat-label {
      font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.8px; padding:8px 14px; display:flex; align-items:center; gap:6px;
    }
    .cat-1 { background:#1e3a5f; color:#58a6ff; }
    .cat-2 { background:#2d1e5f; color:#bc8cff; }
    .cat-3 { background:#1e4a2d; color:#3fb950; }
    .cat-4 { background:#4a2d1e; color:#e3b341; }
    .cat-5 { background:#4a1e2d; color:#f778a1; }
    .cat-6 { background:#1e424a; color:#39d353; }
    .cat-7 { background:#2d2d2d; color:#8b949e; }

    /* ── ITEM CARD ── */
    .item-card {
      background:var(--surface); border:1px solid var(--border);
      border-left:3px solid var(--green); margin-bottom:2px; overflow:hidden;
    }
    .item-card:last-of-type { margin-bottom:0; }

    .item-main {
      display:flex; align-items:center; gap:10px;
      padding:11px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .item-main:hover { background:rgba(255,255,255,.02); }

    .item-info   { flex:1; min-width:0; }
    .item-name   { font-size:14px; font-weight:700; }
    .item-desc   { font-size:11px; color:var(--muted); margin-top:1px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-qty-unit { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); flex-shrink:0; }
    .qty-badge {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:6px; padding:2px 8px; font-weight:700; font-size:13px; color:var(--text);
    }
    .item-price-block { text-align:right; flex-shrink:0; min-width:90px; }
    .unit-price  { font-size:11px; color:var(--muted); }
    .line-total  { font-size:16px; font-weight:800; color:var(--green); }
    .expand-btn  {
      width:28px; height:28px; flex-shrink:0;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:6px; display:flex; align-items:center; justify-content:center;
      font-size:11px; color:var(--muted); cursor:pointer; transition:all .15s;
      -webkit-tap-highlight-color:transparent; user-select:none;
    }
    .expand-btn.open { background:rgba(88,166,255,.1); border-color:var(--accent); color:var(--accent); }

    /* ── COMPARISON PANEL ── */
    .compare-panel {
      display:none; border-top:1px solid var(--border);
      background:var(--surface2); padding:12px 14px;
    }
    .compare-panel.open { display:block; }

    .cp-section-title {
      font-size:10px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;
      display:flex; align-items:center; gap:6px;
    }
    .cp-section-title::after { content:''; flex:1; height:1px; background:var(--border); }

    .compare-grid {
      display:grid; gap:6px;
      grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
    }
    .compare-store {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:8px 10px; text-align:center;
    }
    .compare-store.is-best    { border-color:var(--green); background:var(--green-bg); }
    .compare-store.is-current { border-color:var(--accent); background:rgba(88,166,255,.08); }
    .cs-name  { font-size:10px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .cs-price { font-size:14px; font-weight:800; }
    .compare-store.is-best    .cs-price { color:var(--green); }
    .compare-store.is-current .cs-price { color:var(--accent); }
    .cs-total { font-size:10px; color:var(--muted); margin-top:2px; }
    .cs-diff  { font-size:11px; font-weight:600; margin-top:4px; }
    .cs-diff.best     { color:var(--green); }
    .cs-diff.over     { color:var(--red); }
    .cs-diff.no-price { color:var(--border); font-style:italic; font-weight:400; font-size:10px; }
    .cs-diff-brl { font-size:10px; color:var(--muted); margin-top:1px; }
    .cs-diff-brl.over { color:rgba(248,81,73,.7); }

    /* ── CATEGORY SUBTOTAL ── */
    .cat-subtotal {
      background:var(--surface2); border:1px solid var(--border);
      border-top:2px solid var(--border);
    }
    .cat-sub-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 14px; cursor:pointer; user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .cat-sub-header:hover { background:rgba(255,255,255,.02); }
    .cat-sub-title {
      font-size:10px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.5px;
      display:flex; align-items:center; gap:6px;
    }
    .cat-sub-body { display:none; padding:10px 14px 12px; }
    .cat-sub-body.open { display:block; }
    .cat-sub-grid {
      display:grid; gap:6px;
      grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    }
    .toggle-icon {
      font-size:10px; color:var(--muted); transition:transform .2s;
      width:20px; height:20px; display:flex; align-items:center; justify-content:center;
      background:var(--surface); border:1px solid var(--border); border-radius:4px;
      flex-shrink:0;
    }
    .toggle-icon.open { color:var(--accent); border-color:var(--accent); }
    /* ── EYE / HIDE CATEGORY ── */
    .eye-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 5px;
      color: rgba(255,255,255,.5);
      font-size: 13px;
      width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
      margin-left: 6px;
    }
    .eye-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .eye-btn.hidden-cat { color: var(--muted); border-color: var(--border); }
    .cat-items-body.hidden { display: none; }
    .cat-hidden-bar {
      padding: 6px 14px;
      font-size: 11px; color: var(--muted);
      background: var(--surface2);
      border-top: 1px solid var(--border);
      display: none;
    }
    .cat-hidden-bar.visible { display: flex; align-items: center; gap: 6px; }

    .cat-sub-cell {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:7px 10px; text-align:center;
    }
    .cat-sub-cell.is-cheapest { border-color:var(--green); background:var(--green-bg); }
    .cat-sub-cell.is-active   { border-color:var(--accent); background:rgba(88,166,255,.07); }
    .csc-name  { font-size:10px; color:var(--muted); font-weight:600; margin-bottom:3px; }
    .csc-total { font-size:13px; font-weight:800; }
    .cat-sub-cell.is-cheapest .csc-total { color:var(--green); }
    .cat-sub-cell.is-active   .csc-total { color:var(--accent); }
    .csc-diff  { font-size:10px; margin-top:3px; font-weight:600; }
    .csc-diff.cheaper   { color:var(--green); }
    .csc-diff.expensive { color:var(--red); }
    .csc-diff.no-data   { color:var(--border); font-style:italic; font-weight:400; }

    /* ── EMPTY/LOADING ── */
    .empty-state { text-align:center; padding:48px 20px; color:var(--muted); }
    .empty-state .es-icon { font-size:40px; margin-bottom:12px; }
    .empty-state h3 { font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
    .loading { text-align:center; padding:60px 20px; color:var(--muted); }
    .loading .spinner {
      width:32px; height:32px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin .8s linear infinite; margin:0 auto 14px;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── TOAST ── */
    #toast-container {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      z-index:300; display:flex; flex-direction:column; gap:8px;
      pointer-events:none; width:90%; max-width:340px;
    }
    .toast {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:10px 14px; font-size:13px;
      font-weight:500; animation:toastIn .25s ease, toastOut .25s ease 2.5s forwards;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    @keyframes toastIn  { from{opacity:0;transform:translateY(20px)} }
    @keyframes toastOut { to  {opacity:0;transform:translateY(20px)} }

    /* ── PRINT ── */
    .print-header { display:none; }
    @media print {
      header,.stores-scroll,.toolbar,.expand-btn,
      .compare-panel,#toast-container { display:none !important; }
      .print-header { display:block !important; padding-bottom:10px;
        border-bottom:2px solid #000; margin-bottom:12px; }
      .print-header h2 { font-size:16px; font-weight:800; color:#000; }
      .print-header p  { font-size:11px; color:#555; }
      body { background:#fff !important; color:#000 !important; font-size:11px; }
      .content { padding:0 !important; max-width:100% !important; }
      .global-card, .store-header-card, .item-card, .cat-subtotal {
        background:#f5f5f5 !important; border:1px solid #ccc !important;
        -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
      }
      .item-name,.shc-title,.scc-total,.csc-total,.line-total { color:#000 !important; }
      .sup-compare-card.is-cheapest .scc-total,
      .cat-sub-cell.is-cheapest .csc-total,
      .mixed-total, .shc-total-val, .line-total { color:#1a6b2e !important; }
      .cat-label { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      @page { margin:12mm 10mm; }
    }
  </style>
</head>
<body>

<div class="print-header" id="print-header">
  <h2>🏗️ Lista de Compras — <span id="print-store-name"></span></h2>
  <p id="print-meta"></p>
</div>

<header>
  <div class="header-left">
    <a class="back-btn" id="back-link" href="index.html">← <span>Orçamento</span></a>
    <div>
      <div class="header-title">🛒 Lista de Compras</div>
      <div class="header-sub">Comparativo completo por fornecedor</div>
    </div>
  </div>
  <div class="sync-badge">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Carregando…</span>
  </div>
</header>

<div class="stores-scroll" id="stores-scroll">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div class="toolbar">
  <button class="btn btn-ghost" onclick="expandAllCompare()">👁️ <span>Ver comparativos</span></button>
  <button class="btn btn-ghost" onclick="collapseAllCompare()">🙈 <span>Recolher</span></button>
  <button class="btn btn-print" onclick="window.print()">🖨️ <span>Imprimir lista</span></button>
</div>

<div class="content" id="content">
  <div class="loading"><div class="spinner"></div><p>Carregando dados…</p></div>
</div>

<div id="toast-container"></div>

<script type="module">
// ── FIREBASE CONFIG ──────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyD6Ia5MRnCdTL0m5Ut1M5L3Ar0Yb3ihiVc",
  authDomain:        "orcamento-8b904.firebaseapp.com",
  databaseURL:       "https://orcamento-8b904-default-rtdb.firebaseio.com",
  projectId:         "orcamento-8b904",
  storageBucket:     "orcamento-8b904.firebasestorage.app",
  messagingSenderId: "777526858495",
  appId:             "1:777526858495:web:1aebe23a77a3f4602672ca",
};

const CATEGORY_META = {
  "1. Concreto e Formas":    { id:1, emoji:"🪨" },
  "2. Ferragens e Aço":      { id:2, emoji:"🔩" },
  "3. Alvenaria e Telhado":  { id:3, emoji:"🧱" },
  "4. Revestimentos":        { id:4, emoji:"🪟" },
  "5. Portas":               { id:5, emoji:"🚪" },
  "6. Louças e Instalações": { id:6, emoji:"🚿" },
};

let state = { suppliers:[], items:[], prices:{} };
let activeSupplierIdx = 0;
const hiddenCats = new Set(); // categories hidden by the eye toggle

// ── INIT ─────────────────────────────────────────────
(async function init() {
  const params = new URLSearchParams(window.location.search);
  const orcId  = params.get('id');
  if (orcId) document.getElementById('back-link').href = `index.html?id=${orcId}`;

  try {
    const { initializeApp }          = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, get, onValue } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

    const app  = initializeApp(FIREBASE_CONFIG);
    const rtdb = getDatabase(app);

    if (!orcId) { showError('Acesse pelo link da página principal.'); return; }

    setSyncStatus('syncing');
    const snap = await get(ref(rtdb, `orcamentos/${orcId}`));
    if (!snap.exists()) { showError('Orçamento não encontrado.'); setSyncStatus('error'); return; }

    const load = d => {
      state.suppliers = d.suppliers || [];
      state.items     = d.items     || [];
      state.prices    = d.prices    || {};
      renderAll();
    };

    load(snap.val());
    setSyncStatus('synced');

    onValue(ref(rtdb, `orcamentos/${orcId}`), s => { if (s.exists()) { load(s.val()); setSyncStatus('synced'); } });

  } catch(e) {
    console.error(e);
    setSyncStatus('error');
    showError('Erro Firebase: ' + e.message);
  }
})();

// ── ANALYSIS ─────────────────────────────────────────
function analyze() {
  // Per item: best price per supplier
  const itemData = {};   // itemId → { prices:[p|null,...], minPrice, minSi }
  state.items.forEach(item => {
    const prices = state.suppliers.map((_, si) => {
      const p = state.prices[`${item.id}-${si}`];
      return (p && p > 0) ? p : null;
    });
    const valid   = prices.filter(p => p !== null);
    const minPrice = valid.length ? Math.min(...valid) : null;
    const minSi   = minPrice !== null ? prices.indexOf(minPrice) : null;
    itemData[item.id] = { prices, minPrice, minSi };
  });

  // Groups: items where supplier si is cheapest (or tied)
  const supGroups = state.suppliers.map((_, si) =>
    state.items
      .filter(item => {
        const d = itemData[item.id];
        return d.minPrice !== null && d.prices[si] === d.minPrice;
      })
      .map(item => ({
        item,
        price: itemData[item.id].prices[si],
        total: itemData[item.id].prices[si] * (item.qty || 0),
      }))
  );

  // Total per supplier of THEIR cheapest items
  const supTotals = supGroups.map(g => g.reduce((a, r) => a + r.total, 0));

  // "Full list" total for each supplier (all items, regardless of cheapest)
  const supFullTotals = state.suppliers.map((_, si) =>
    state.items.reduce((acc, item) => {
      const p = state.prices[`${item.id}-${si}`];
      return acc + (p && p > 0 ? p * (item.qty || 0) : 0);
    }, 0)
  );

  // Mixed shopping: for each item take the cheapest price
  const mixedTotal = state.items.reduce((acc, item) => {
    const d = itemData[item.id];
    return acc + (d.minPrice !== null ? d.minPrice * (item.qty || 0) : 0);
  }, 0);

  // Cheapest by group total (items where they're cheapest)
  const validGroupTotals = supTotals.map((t, si) => supGroups[si].length > 0 ? t : null);
  const minGroupTotal    = Math.min(...validGroupTotals.filter(t => t !== null));
  const cheapestGroupIdx = validGroupTotals.indexOf(minGroupTotal);

  // Cheapest by full total
  const validFull = supFullTotals.map((t, si) => t > 0 ? t : null);
  const minFull   = Math.min(...validFull.filter(t => t !== null));
  const cheapestFullIdx = supFullTotals.indexOf(minFull);

  // Items with no price at all
  const noPrice = state.items.filter(item => itemData[item.id].minPrice === null);

  // Category-level totals per supplier
  const catTotals = {}; // cat → [total per si]
  state.items.forEach(item => {
    if (!catTotals[item.cat]) catTotals[item.cat] = state.suppliers.map(() => 0);
    itemData[item.id].prices.forEach((p, si) => {
      if (p !== null) catTotals[item.cat][si] += p * (item.qty || 0);
    });
  });

  return { itemData, supGroups, supTotals, supFullTotals,
           cheapestGroupIdx, cheapestFullIdx, mixedTotal,
           noPrice, catTotals };
}

// ── RENDER ────────────────────────────────────────────
function renderAll() {
  const a = analyze();
  renderTabs(a);
  renderContent(a);
}

function renderTabs({ supGroups, supTotals, cheapestGroupIdx }) {
  const bar = document.getElementById('stores-scroll');
  bar.innerHTML = state.suppliers.map((sup, si) => {
    const count  = supGroups[si].length;
    const total  = supTotals[si];
    const isBest = si === cheapestGroupIdx && count > 0;
    return `<div class="store-tab${si === activeSupplierIdx ? ' active' : ''}" onclick="setActiveSupplier(${si})">
      <div class="st-name">🏪 ${escHtml(sup)} ${isBest ? '<span class="badge-best">Menor total</span>' : ''}</div>
      <div class="st-items">${count} iten${count!==1?'s':''} mais barato${count!==1?'s':''}</div>
      <div class="st-total">${total > 0 ? fmtCurrency(total) : '—'}</div>
    </div>`;
  }).join('');
}

function renderContent(a) {
  const { itemData, supGroups, supTotals, supFullTotals,
          cheapestGroupIdx, cheapestFullIdx, mixedTotal,
          noPrice, catTotals } = a;

  const si    = activeSupplierIdx;
  const sup   = state.suppliers[si];
  const items = supGroups[si];
  const total = supTotals[si];

  const content = document.getElementById('content');
  if (state.items.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="es-icon">📋</div><h3>Nenhum item</h3><p>Volte ao orçamento e adicione materiais.</p></div>`;
    return;
  }

  const maxFull   = Math.max(...supFullTotals.filter(t=>t>0), 1);
  const cheapFull = supFullTotals[cheapestFullIdx] || 0;

  const supCards = state.suppliers.map((s, sIdx) => {
    const t = supFullTotals[sIdx];
    if (!t) return '';
    const isCheapest = sIdx === cheapestFullIdx;
    const isActive   = sIdx === si;
    const diffR = t - cheapFull;
    const diffP = cheapFull > 0 ? ((t - cheapFull)/cheapFull*100).toFixed(1) : 0;
    const pct   = Math.round((t/maxFull)*100);
    const diffHtml = isCheapest
      ? `<div class="scc-diff cheaper">✅ menor preço total</div>`
      : `<div class="scc-diff expensive">+${fmtCurrency(diffR)} (+${diffP}%)</div>`;

    return `<div class="sup-compare-card${isCheapest?' is-cheapest':''}${isActive?' is-active':''}"
               onclick="setActiveSupplier(${sIdx})" title="Ver lista de ${escHtml(s)}">
      <div class="scc-name">${escHtml(s)}</div>
      <div class="scc-total">${fmtCurrency(t)}</div>
      ${diffHtml}
      <div class="scc-items">${supGroups[sIdx].length} itens na lista</div>
      <div class="scc-bar"><div class="scc-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  const bestSingle = supFullTotals[cheapestFullIdx] || 0;
  const savingMixed = bestSingle - mixedTotal;
  const savingPct   = bestSingle > 0 ? (savingMixed/bestSingle*100).toFixed(1) : 0;
  const cheapSupName = state.suppliers[cheapestFullIdx] || '—';
  const globalSummary = cheapFull > 0 ? `Menor: <strong style="color:var(--green)">${escHtml(cheapSupName)} ${fmtCurrency(cheapFull)}</strong>` : 'Preencha preços';

  let html = `
  <div class="global-card">
    <div class="gc-header" onclick="toggleGlobal()">
      <div>
        <div class="gc-title">📊 Comparativo Global — Todas as lojas</div>
        <div class="gc-summary">${globalSummary}</div>
      </div>
      <div class="toggle-icon" id="global-toggle-icon">▶</div>
    </div>
    <div class="gc-body" id="global-body">
      <div class="sup-compare-grid" style="margin-bottom:12px">${supCards}</div>
      ${mixedTotal > 0 ? `
      <div class="mixed-row">
        <div class="mixed-row-left">
          <div class="mixed-row-title">🎯 Compra mista ideal (item mais barato de cada loja)</div>
          <div class="mixed-row-sub">
            Comprando cada item na loja mais barata você economiza
            ${savingMixed > 0
              ? `<strong style="color:var(--green)">${fmtCurrency(savingMixed)} (${savingPct}%)</strong> em relação à loja mais barata sozinha`
              : 'o mesmo que a loja mais barata'}
          </div>
        </div>
        <div class="mixed-row-right">
          <div class="mixed-total">${fmtCurrency(mixedTotal)}</div>
          <div class="mixed-saving">mínimo possível</div>
        </div>
      </div>` : ''}
    </div>
  </div>`;

  // ── 2. STORE HEADER ────────────────────────────────
  const isBest = si === cheapestFullIdx && supFullTotals[si] > 0;
  html += `
  <div class="store-header-card">
    <div>
      <div class="shc-title">🏪 ${escHtml(sup)}</div>
      <div class="shc-meta">${items.length} iten${items.length!==1?'s':''} com menor preço nesta loja${isBest?' · ✅ Loja com menor total geral':''}</div>
    </div>
    <div class="shc-total-block">
      <div class="shc-total-lbl">Total desta lista</div>
      <div class="shc-total-val">${total > 0 ? fmtCurrency(total) : '—'}</div>
    </div>
  </div>`;

  if (items.length === 0) {
    html += `<div class="empty-state"><div class="es-icon">🤔</div>
      <h3>Nenhum item mais barato em ${escHtml(sup)}</h3>
      <p>Preencha os preços desta loja no orçamento.</p></div>`;
    content.innerHTML = html;
    updatePrintHeader(sup, 0, 0);
    return;
  }

  // ── 3. ITEMS BY CATEGORY ───────────────────────────
  const byCat = {};
  items.forEach(row => {
    const cat = row.item.cat || 'Outros';
    if (!byCat[cat]) byCat[cat] = [];
    byCat[cat].push(row);
  });

  Object.entries(byCat).forEach(([cat, rows]) => {
    const meta       = CATEGORY_META[cat] || { id:7, emoji:'📦' };
    const catCls     = `cat-${meta.id}`;
    const catRowTotal = rows.reduce((a,r) => a+r.total, 0);
    const catKey     = cat.replace(/[^a-z0-9]/gi,'_');
    const isHidden   = hiddenCats.has(cat);

    html += `<div class="cat-section">
      <div class="cat-label ${catCls}" style="display:flex;align-items:center">
        <span>${meta.emoji} ${escHtml(cat)}</span>
        <span style="margin-left:auto;font-weight:400;opacity:${isHidden ? .4 : .8}">
          ${isHidden ? '<s>' : ''}${fmtCurrency(catRowTotal)}${isHidden ? '</s>' : ''}
        </span>
        <button class="eye-btn${isHidden ? ' hidden-cat' : ''}" onclick="toggleCatVisibility('${escHtml(cat).replace(/'/g,'\\&apos;')}')" title="${isHidden ? 'Mostrar' : 'Ocultar'} categoria">
          ${isHidden ? '🙈' : '👁️'}
        </button>
      </div>
      <div class="cat-items-body${isHidden ? ' hidden' : ''}" id="cat-items-${catKey}">`;

    // Items
    rows.forEach(({ item, price, total: lineTotal }) => {
      const d     = itemData[item.id];
      const compCells = state.suppliers.map((sName, sIdx) => {
        const p       = d.prices[sIdx];
        const isBestS = p !== null && p === d.minPrice;
        const isCurr  = sIdx === si;
        const diffR   = p !== null && !isBestS ? p - d.minPrice : null;
        const diffP   = diffR !== null && d.minPrice > 0 ? ((diffR/d.minPrice)*100).toFixed(1) : null;
        const lineT   = p !== null ? p * (item.qty||0) : null;
        let cls = '';
        if (isBestS) cls = ' is-best';
        if (isCurr)  cls += ' is-current';

        return `<div class="compare-store${cls}">
          <div class="cs-name">${escHtml(sName)}</div>
          ${p !== null
            ? `<div class="cs-price">${fmtCurrencyRaw(p)}</div>
               <div class="cs-total">Total: ${fmtCurrency(lineT)}</div>
               ${isBestS
                  ? `<div class="cs-diff best">✅ menor</div>`
                  : `<div class="cs-diff over">+${diffP}%</div>
                     <div class="cs-diff-brl over">+${fmtCurrency(diffR)} a mais</div>`}`
            : `<div class="cs-price" style="color:var(--border)">—</div>
               <div class="cs-diff no-price">sem preço</div>`}
        </div>`;
      }).join('');

      html += `<div class="item-card">
        <div class="item-main" onclick="toggleCompare('${item.id}')">
          <div class="item-info">
            <div class="item-name">${escHtml(item.name)}</div>
            <div class="item-desc">${escHtml(item.desc)}</div>
          </div>
          <div class="item-qty-unit"><div class="qty-badge">${item.qty}</div><span>${escHtml(item.unit)}</span></div>
          <div class="item-price-block">
            <div class="unit-price">${fmtCurrencyRaw(price)} / ${escHtml(item.unit)}</div>
            <div class="line-total">${fmtCurrency(lineTotal)}</div>
          </div>
          <div class="expand-btn" id="expand-${item.id}">▼</div>
        </div>
        <div class="compare-panel" id="panel-${item.id}">
          <div class="cp-section-title">🔍 Comparativo entre fornecedores — ${escHtml(item.name)} (${item.qty} ${escHtml(item.unit)})</div>
          <div class="compare-grid">${compCells}</div>
        </div>
      </div>`;
    });

    // ── Category subtotal (ALL suppliers for this category) ──
    const catSupTotals = (catTotals[cat] || []).map(t => t > 0 ? t : null);
    const validCatTotals = catSupTotals.filter(t => t !== null);
    const minCatTotal    = validCatTotals.length ? Math.min(...validCatTotals) : null;

    if (minCatTotal !== null) {
      const subCells = state.suppliers.map((sName, sIdx) => {
        const t       = catSupTotals[sIdx];
        const isCheap = t === minCatTotal;
        const isCurr  = sIdx === si;
        const diffR   = t !== null && !isCheap ? t - minCatTotal : null;
        const diffP   = diffR !== null && minCatTotal > 0 ? ((diffR/minCatTotal)*100).toFixed(0) : null;
        let cls = '';
        if (isCheap) cls = ' is-cheapest';
        if (isCurr)  cls += ' is-active';
        return `<div class="cat-sub-cell${cls}">
          <div class="csc-name">${escHtml(sName)}</div>
          ${t !== null
            ? `<div class="csc-total">${fmtCurrency(t)}</div>
               ${isCheap
                  ? `<div class="csc-diff cheaper">✅ menor</div>`
                  : `<div class="csc-diff expensive">+${fmtCurrency(diffR)} (+${diffP}%)</div>`}`
            : `<div class="csc-total" style="color:var(--border)">—</div>
               <div class="csc-diff no-data">sem cotação</div>`}
        </div>`;
      }).join('');

      const catKey2 = cat.replace(/[^a-z0-9]/gi,'_');
      html += `<div class="cat-subtotal">
        <div class="cat-sub-header" onclick="toggleCatSub('${catKey2}')">
          <div class="cat-sub-title">📊 Subtotal por loja — ${escHtml(cat)}</div>
          <div class="toggle-icon" id="cat-toggle-${catKey2}">▶</div>
        </div>
        <div class="cat-sub-body" id="cat-sub-${catKey2}">
          <div class="cat-sub-grid">${subCells}</div>
        </div>
      </div>`;
    }

    // Close cat-items-body, then render subtotal outside it
    html += `</div>`; // close cat-items-body

    html += `</div>`; // end cat-section
  });

  // Items with no price
  if (noPrice.length > 0) {
    html += `<div class="cat-section" style="margin-top:20px">
      <div class="cat-label cat-7">⚠️ Itens sem cotação (${noPrice.length})</div>
      ${noPrice.map(item => `
        <div class="item-card" style="border-left-color:var(--border)">
          <div class="item-main" style="cursor:default">
            <div class="item-info">
              <div class="item-name" style="color:var(--muted)">${escHtml(item.name)}</div>
              <div class="item-desc">${escHtml(item.desc)}</div>
            </div>
            <div class="item-qty-unit"><div class="qty-badge">${item.qty}</div><span>${escHtml(item.unit)}</span></div>
            <div class="item-price-block"><div style="font-size:12px;color:var(--muted)">Sem preço</div></div>
          </div>
        </div>`).join('')}
    </div>`;
  }

  content.innerHTML = html;
  updatePrintHeader(sup, items.length, total);
}

// ── HELPERS ───────────────────────────────────────────
function updatePrintHeader(sup, count, total) {
  document.getElementById('print-store-name').textContent = sup;
  document.getElementById('print-meta').textContent =
    `${count} itens · Total: ${fmtCurrency(total)} · Impresso em ${new Date().toLocaleDateString('pt-BR')}`;
}

window.toggleCatVisibility = function(cat) {
  if (hiddenCats.has(cat)) hiddenCats.delete(cat);
  else hiddenCats.add(cat);
  renderAll();
};

window.toggleGlobal = function() {
  const body = document.getElementById('global-body');
  const icon = document.getElementById('global-toggle-icon');
  if (!body) return;
  const open = body.classList.toggle('open');
  if (icon) { icon.classList.toggle('open', open); icon.textContent = open ? '▼' : '▶'; }
};

window.toggleCatSub = function(catKey) {
  const body = document.getElementById(`cat-sub-${catKey}`);
  const icon = document.getElementById(`cat-toggle-${catKey}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (icon) { icon.classList.toggle('open', open); icon.textContent = open ? '▼' : '▶'; }
};

window.setActiveSupplier = function(si) {
  activeSupplierIdx = si;
  renderAll();
  window.scrollTo({ top:0, behavior:'smooth' });
};

window.toggleCompare = function(itemId) {
  const panel = document.getElementById(`panel-${itemId}`);
  const btn   = document.getElementById(`expand-${itemId}`);
  if (!panel) return;
  const open = panel.classList.toggle('open');
  if (btn) { btn.classList.toggle('open', open); btn.textContent = open ? '▲' : '▼'; }
};

window.expandAllCompare = function() {
  document.querySelectorAll('.compare-panel').forEach(p => p.classList.add('open'));
  document.querySelectorAll('.expand-btn').forEach(b => { b.classList.add('open'); b.textContent='▲'; });
};

window.collapseAllCompare = function() {
  document.querySelectorAll('.compare-panel').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.expand-btn').forEach(b => { b.classList.remove('open'); b.textContent='▼'; });
};

function showError(msg) {
  document.getElementById('content').innerHTML =
    `<div class="empty-state"><div class="es-icon">❌</div><h3>Erro</h3><p>${escHtml(msg)}</p>
     <br><a href="index.html" style="color:var(--accent)">← Voltar ao orçamento</a></div>`;
  document.getElementById('stores-scroll').innerHTML = '';
}

function setSyncStatus(s) {
  document.getElementById('sync-dot').className = 'sync-dot ' + s;
  document.getElementById('sync-label').textContent = {syncing:'Carregando…',synced:'Atualizado',error:'Erro'}[s] || '';
}

function fmtCurrency(v) {
  if (!v && v!==0) return '';
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}
function fmtCurrencyRaw(v) {
  if (!v) return '';
  return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
